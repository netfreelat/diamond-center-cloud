<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Canje - Diamond Center</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --neon-cyan: #00f0ff;
            --neon-purple: #9d00ff;
            --dark-bg: #0a0510;
        }

        body {
            background-color: var(--dark-bg);
            background-image: radial-gradient(circle at 50% 50%, #1a0b2e 0%, #0a0510 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .redeem-card {
            background: rgba(20, 10, 35, 0.8);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.1);
            backdrop-filter: blur(10px);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .redeem-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
            animation: border-anim 3s linear infinite;
        }

        @keyframes border-anim {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .redeem-title {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 10px;
            background: linear-gradient(to right, #fff, var(--neon-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .step {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #666;
            transition: all 0.3s ease;
        }

        .step.active {
            background: rgba(0, 240, 255, 0.15);
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--neon-cyan);
            margin-bottom: 8px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .redeem-input {
            width: 100%;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 12px;
            color: #fff;
            font-size: 1.1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .redeem-input:focus {
            border-color: var(--neon-cyan);
            background: rgba(0, 240, 255, 0.05);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.1);
        }

        .player-card {
            background: linear-gradient(135deg, rgba(157, 0, 255, 0.1), rgba(0, 240, 255, 0.1));
            border: 1px solid rgba(0, 240, 255, 0.2);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            display: none;
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .player-name {
            font-size: 1.4rem;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-cyan);
        }

        .btn-redeem {
            width: 100%;
            padding: 18px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, var(--neon-cyan), #00a2ff);
            color: #000;
            font-size: 1.1rem;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .btn-redeem:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 240, 255, 0.4);
        }

        .btn-redeem:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>

    <div class="redeem-card">
        <h1 class="redeem-title">CANJE DE PINES</h1>
        <p style="color: #aaa; font-size: 0.9rem; margin-bottom: 30px;">FREE FIRE • LATAM</p>

        <div class="step-indicator">
            <div id="step1" class="step active">1</div>
            <div id="step2" class="step">2</div>
        </div>

        <!-- PASO 1: ID -->
        <div id="section-id">
            <div class="input-group">
                <label>Ingresa tu ID de Jugador</label>
                <input type="text" id="uid-input" class="redeem-input" placeholder="Ej: 123456789">
            </div>
            <button id="btn-verify" class="btn-redeem">Consultar ID</button>
        </div>

        <!-- INFORMACIÓN DEL JUGADOR -->
        <div id="player-display" class="player-card">
            <p style="font-size: 0.7rem; color: var(--neon-cyan); text-transform: uppercase; margin-bottom: 5px;">Jugador Encontrado:</p>
            <div id="player-name" class="player-name">---</div>
        </div>

        <!-- PASO 2: PIN -->
        <div id="section-pin" style="display: none;">
            <div class="input-group">
                <label>Ingresa tu PIN de Diamantes</label>
                <input type="text" id="pin-input" class="redeem-input" placeholder="Pega tu código aquí">
            </div>
            <button id="btn-redeem-final" class="btn-redeem">Canjear Diamantes</button>
        </div>

        <div style="margin-top: 30px;">
            <a href="index.html" style="color: #666; text-decoration: none; font-size: 0.85rem;">
                <i class="fa-solid fa-arrow-left"></i> Volver a la tienda
            </a>
        </div>
    </div>

    <script>
        const SERVER_URL = 'https://diamond-center-cloud.onrender.com';
        
        const btnVerify = document.getElementById('btn-verify');
        const btnRedeem = document.getElementById('btn-redeem-final');
        const sectionId = document.getElementById('section-id');
        const sectionPin = document.getElementById('section-pin');
        const playerDisplay = document.getElementById('player-display');
        const playerNameEl = document.getElementById('player-name');
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');

        // Leer parámetros de la URL (Autocompletado)
        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const uid = urlParams.get('uid');
            const pin = urlParams.get('pin');
            if (uid) document.getElementById('uid-input').value = uid;
            if (pin) document.getElementById('pin-input').value = pin;
        };

        btnVerify.onclick = async () => {
            const uid = document.getElementById('uid-input').value.trim();
            if (!uid) return Swal.fire('Error', 'Ingresa tu ID', 'error');

            btnVerify.disabled = true;
            btnVerify.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Verificando...';

            try {
                const res = await fetch(`${SERVER_URL}/verificar?uid=${uid}`);
                const data = await res.json();

                if (data.success) {
                    playerNameEl.innerText = data.nombre;
                    playerDisplay.style.display = 'block';
                    sectionId.style.display = 'none';
                    sectionPin.style.display = 'block';
                    step1.classList.remove('active');
                    step2.classList.add('active');
                } else {
                    Swal.fire('ID no encontrado', 'Verifica el número e intenta de nuevo.', 'warning');
                }
            } catch (err) {
                Swal.fire('Error', 'No se pudo conectar con el servidor', 'error');
            } finally {
                btnVerify.disabled = false;
                btnVerify.innerText = 'Consultar ID';
            }
        };

        btnRedeem.onclick = async () => {
            const uid = document.getElementById('uid-input').value.trim();
            const pin = document.getElementById('pin-input').value.trim();

            if (!pin) return Swal.fire('Error', 'Ingresa el PIN', 'error');

            // Si es un PIN de Chile (UUID), avisar que el bot está trabajando
            const isChilePin = pin.length > 20 && pin.includes('-');
            
            Swal.fire({
                title: isChilePin ? 'Iniciando Canje Automático' : 'Procesando Canje',
                html: `
                    <div style="text-align: center;">
                        <p style="font-size: 0.9rem;">${isChilePin ? 'Nuestro bot está completando el formulario de Redeempins por ti...' : 'Conectando con el servidor...'}</p>
                        <div class="loader-custom" style="margin: 20px auto; width: 50px; height: 50px; border: 5px solid rgba(0,240,255,0.2); border-top-color: #00f0ff; border-radius: 50%; animation: spin 1s linear infinite;"></div>
                    </div>
                `,
                showConfirmButton: false,
                allowOutsideClick: false,
                didOpen: () => {
                    // Estilo para la animación
                    const style = document.createElement('style');
                    style.innerHTML = '@keyframes spin { to { transform: rotate(360deg); } }';
                    document.head.appendChild(style);
                }
            });

            try {
                const res = await fetch(`${SERVER_URL}/api/redeem_pin?uid=${uid}&pin=${encodeURIComponent(pin)}`);
                const data = await res.json();

                if (data.success) {
                    Swal.fire({
                        title: '¡CANJE EXITOSO!',
                        text: data.message || 'Los diamantes han sido acreditados.',
                        icon: 'success',
                        confirmButtonText: 'Genial'
                    }).then(() => location.reload());
                } else {
                    Swal.fire('Atención', data.message || 'El PIN no pudo ser canjeado.', 'info');
                }
            } catch (err) {
                Swal.fire('Error', 'Ocurrió un problema en el servidor.', 'error');
            }
        };
    </script>
</body>
</html>
